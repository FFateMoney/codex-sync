[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sync"
version = "0.1.0"
description = "Lossless file-level sync for local Codex sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "FFateMoney" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
codex-sync = "codex_sync:main"

[tool.setuptools]
py-modules = ["codex_sync"]
